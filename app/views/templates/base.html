<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Detección de Ocupación{% endblock %}</title>
    <style>
        :root {
            --bg: #e7eefc;
            --surface: rgba(255, 255, 255, 0.95);
            --text: #1a202c;
            --muted: #4a5568;
            --accent: #667eea;
            --accent-hover: #5568d3;
            --accent-alt: #764ba2;
            --border: #d2d6dc;
            --card-bg: rgba(255, 255, 255, 0.98);
            --shadow: rgba(15, 23, 42, 0.08);
            --success-bg: #dcfce7;
            --danger-bg: #fee2e2;
            --result-text: #111827;
        }
        body.dark {
            --bg: #0f172a;
            --surface: rgba(15, 23, 42, 0.92);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #8ab4f8;
            --accent-hover: #5b8cff;
            --accent-alt: #c084fc;
            --border: #334155;
            --card-bg: rgba(30, 41, 59, 0.95);
            --shadow: rgba(0, 0, 0, 0.45);
            --success-bg: #134e4a;
            --danger-bg: #7f1d1d;
            --result-text: #f8fafc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.25), transparent 25%),
                        radial-gradient(circle at bottom right, rgba(102,126,234,0.18), transparent 20%);
            pointer-events: none;
            opacity: 0.85;
            z-index: -1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        nav {
            background: var(--surface);
            border-radius: 14px;
            padding: 18px 24px;
            margin-bottom: 28px;
            box-shadow: 0 20px 30px var(--shadow);
            border: 1px solid rgba(255,255,255,0.35);
        }
        .nav-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        nav a {
            text-decoration: none;
            color: var(--text);
            padding: 10px 18px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        nav a:hover, nav a.active {
            background: var(--accent);
            color: white;
        }
        .mode-toggle {
            background: var(--accent-alt);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .mode-toggle:hover {
            background: var(--accent-hover);
        }
        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 22px;
            box-shadow: 0 18px 30px var(--shadow);
            border: 1px solid rgba(255,255,255,0.35);
            color: var(--text);
        }
        body.dark .card {
            background: rgba(30, 41, 59, 0.96);
            border-color: rgba(148, 163, 184, 0.12);
        }
        .card p,
        .card li,
        .card td,
        .card th,
        .card h1,
        .card h2,
        .card h3,
        .card h4 {
            color: var(--text);
        }
        body.dark input,
        body.dark select,
        body.dark option {
            background: rgba(255,255,255,0.08);
            border-color: rgba(148,163,184,0.55);
            color: var(--text);
        }
        select option {
            color: var(--text);
            background: var(--card-bg);
        }
        body.dark select option {
            background: rgba(15, 23, 42, 0.96);
        }
        select option:hover {
            background: rgba(102, 126, 234, 0.18);
        }
        h1, h2, h3, h4 {
            color: var(--text);
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--muted);
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            background: transparent;
            color: var(--text);
            transition: border-color 0.25s ease, background 0.25s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.15);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        button.secondary {
            background: var(--accent-alt);
        }
        button.secondary:hover {
            background: #5a3d7a;
        }
        .result {
            background: var(--surface);
            padding: 22px;
            border-radius: 14px;
            margin-top: 22px;
            color: var(--result-text);
        }
        .result.occupied {
            background: var(--danger-bg);
            border-left: 5px solid #e11d48;
        }
        .result.not-occupied {
            background: var(--success-bg);
            border-left: 5px solid #16a34a;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--accent);
            color: white;
        }
        td, th {
            color: var(--text);
        }
        img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }
        .model-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .model-btn {
            padding: 12px 24px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .model-btn:hover, .model-btn.active {
            background: var(--accent);
            color: white;
        }
        .file-upload {
            border: 2px dashed var(--accent);
            padding: 30px;
            text-align: center;
            border-radius: 16px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.6);
            color: var(--text);
        }
        body.dark .file-upload {
            background: rgba(255,255,255,0.08);
        }
        .file-upload input {
            display: none;
        }
        .file-upload label {
            cursor: pointer;
            color: var(--accent);
            font-weight: 700;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .tab:hover, .tab.active {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="nav-main">
                <ul>
                    <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Inicio</a></li>
                    <li><a href="/prediction" class="{% if request.url.path.startswith('/prediction') %}active{% endif %}">Predicción</a></li>
                    <li><a href="/comparison" class="{% if request.url.path.startswith('/comparison') %}active{% endif %}">Comparación</a></li>
                    <li><a href="/analysis" class="{% if request.url.path.startswith('/analysis') %}active{% endif %}">Análisis</a></li>
                </ul>
                <button id="themeToggle" class="mode-toggle">Modo Oscuro</button>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const storedTheme = localStorage.getItem('themeMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const currentTheme = storedTheme || (prefersDark ? 'dark' : 'light');
        const setTheme = (theme) => {
            document.body.classList.toggle('dark', theme === 'dark');
            themeToggle.textContent = theme === 'dark' ? 'Modo Claro' : 'Modo Oscuro';
            localStorage.setItem('themeMode', theme);
        };
        setTheme(currentTheme);
        themeToggle.addEventListener('click', () => {
            setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
        });
        {% block scripts %}{% endblock %}
    </script>
</body>
</html>
